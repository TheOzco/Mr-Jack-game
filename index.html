<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستر جک - نقشه وایت‌چپل ۱۸۸۸</title>
    <style>
        :root {
            --bg-dark: #090a0f;
            --panel-bg: rgba(22, 26, 38, 0.95);
            --gold: #d4af37;
            --crimson: #900c3f;
            --street-dark: #1a1c23;
            --street-light: #2c2f3d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: 'Georgia', serif;
            background: var(--bg-dark);
            color: #e0e0e0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #141722 0%, #050608 100%);
        }

        /* پنل ابزار و اطلاعات */
        .sidebar {
            width: 320px;
            background: var(--panel-bg);
            border-left: 2px solid var(--gold);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
        }

        .title-box {
            text-align: center;
            border-bottom: 2px dashed #444;
            padding-bottom: 15px;
        }

        .title-box h1 {
            font-size: 24px;
            color: var(--gold);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        /* نقشه بازی */
        .map-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .board-container {
            position: relative;
            padding: 25px;
            background: #111319;
            border-radius: 16px;
            border: 4px solid #332a1d;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 100px rgba(0,0,0,0.8);
        }

        .grid-map {
            display: grid;
            grid-template-columns: repeat(6, 95px);
            grid-template-rows: repeat(6, 95px);
            gap: 8px;
            position: relative;
        }

        /* کاشی‌های خیابان */
        .tile {
            background-color: var(--street-dark);
            border-radius: 8px;
            position: relative;
            border: 1px solid #2a2d3d;
            background-image: 
                radial-gradient(rgba(255,255,255,0.03) 1px, transparent 0);
            background-size: 8px 8px;
            transition: all 0.3s ease;
            cursor: pointer;
            overflow: hidden;
        }

        .tile:hover {
            border-color: var(--gold);
            box-shadow: inset 0 0 15px rgba(212, 175, 55, 0.2);
        }

        /* حالت روشنایی چراغ گازی */
        .tile.lamp-lit {
            background-color: #2b281e;
            border-color: #f39c12;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.25), inset 0 0 25px rgba(243, 156, 18, 0.15);
        }

        /* افکت مه لندن روی خانه‌های تاریک */
        .tile.foggy::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 12, 18, 0.65);
            backdrop-filter: blur(2px);
            pointer-events: none;
        }

        /* نماد چراغ گازی خیابان */
        .gas-lamp {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 16px;
            height: 16px;
            background: #f1c40f;
            border-radius: 50%;
            box-shadow: 0 0 12px #f1c40f;
            z-index: 3;
        }

        /* مهره‌های پرتره‌دار با ظاهر چوبی/فلزی */
        .character-token {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            box-shadow: 0 8px 16px rgba(0,0,0,0.8), inset 0 2px 4px rgba(255,255,255,0.4);
            border: 3px solid #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .character-token:hover {
            transform: translate(-50%, -55%) scale(1.08);
            box-shadow: 0 12px 20px rgba(0,0,0,0.9), 0 0 15px var(--gold);
        }

        .character-token.cleared {
            filter: grayscale(100%) brightness(0.5);
            opacity: 0.4;
        }

        .character-token.selected {
            border-color: var(--gold);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        /* راهنما و دکمه‌ها */
        .btn-action {
            background: linear-gradient(135deg, #c0392b, #8e44ad);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: 0.2s;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(192, 57, 43, 0.5);
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="title-box">
            <h1>WHITECHAPEL</h1>
            <small style="color:#aaa;">لندن - ۱۸۸۸</small>
        </div>

        <div style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px;">
            <div style="font-size: 14px; margin-bottom: 8px;">وضعیت محله:</div>
            <div style="color: var(--gold); font-size: 13px;">💡 ۴ چراغ روشن | 🌙 ۵ کوچه تاریک</div>
        </div>

        <button class="btn-action" onclick="toggleFog()">🌫️ تغییر وضعیت مه / تاریکی</button>

        <div style="margin-top: auto; font-size: 12px; color: #888; line-height: 1.6;">
            <b>جزئیات گرافیکی جدید:</b><br>
            • کاشی‌های سنگ‌فرش با هاله نوری چراغ گازی.<br>
            • افکت مه لندن (Fog Blur) روی کوچه‌های تاریک.<br>
            • مهره‌های سه‌بعدی سنگین همراه با سایه واقعی.
        </div>
    </div>

    <div class="map-wrapper">
        <div class="board-container">
            <div class="grid-map" id="map"></div>
        </div>
    </div>

<script>
    const GRID_SIZE = 6;

    // داده‌های اولیه نقشه چراغ‌ها
    const lamps = [
        { x: 1, y: 0 }, { x: 4, y: 0 },
        { x: 0, y: 2 }, { x: 5, y: 3 },
        { x: 1, y: 5 }, { x: 4, y: 5 }
    ];

    // شخصیت‌ها همراه با پرتره و رنگ اختصاصی
    const characters = [
        { name: "شرلوک", color: "linear-gradient(135deg, #2980b9, #2c3e50)", x: 1, y: 1 },
        { name: "واتسون", color: "linear-gradient(135deg, #8e44ad, #2c3e50)", x: 4, y: 1 },
        { name: "لسترید", color: "linear-gradient(135deg, #d35400, #2c3e50)", x: 1, y: 4 },
        { name: "استلث", color: "linear-gradient(135deg, #16a085, #2c3e50)", x: 4, y: 4 },
        { name: "جفرسون", color: "linear-gradient(135deg, #f39c12, #2c3e50)", x: 2, y: 2 },
        { name: "گالی", color: "linear-gradient(135deg, #c0392b, #2c3e50)", x: 3, y: 3 }
    ];

    let showFog = true;
    let selectedToken = null;

    function buildMap() {
        const mapEl = document.getElementById('map');
        mapEl.innerHTML = '';

        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                const isLamp = lamps.some(l => l.x === c && l.y === r);
                const tile = document.createElement('div');
                tile.className = `tile ${isLamp ? 'lamp-lit' : (showFog ? 'foggy' : '')}`;

                if (isLamp) {
                    const lampEl = document.createElement('div');
                    lampEl.className = 'gas-lamp';
                    tile.appendChild(lampEl);
                }

                // چک کردن حضور شخصیت
                const char = characters.find(ch => ch.x === c && ch.y === r);
                if (char) {
                    const token = document.createElement('div');
                    token.className = `character-token ${selectedToken === char ? 'selected' : ''}`;
                    token.style.background = char.color;
                    token.innerText = char.name;
                    token.onclick = (e) => {
                        e.stopPropagation();
                        selectedToken = char;
                        buildMap();
                    };
                    tile.appendChild(token);
                }

                tile.onclick = () => {
                    if (selectedToken) {
                        selectedToken.x = c;
                        selectedToken.y = r;
                        selectedToken = null;
                        buildMap();
                    }
                };

                mapEl.appendChild(tile);
            }
        }
    }

    function toggleFog() {
        showFog = !showFog;
        buildMap();
    }

    buildMap();
</script>
</body>
</html>
