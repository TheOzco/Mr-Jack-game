<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستر جک - نسخه Phaser.js</title>
    <!-- موتور بازی‌سازی Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <!-- کتابخانه آنلاین -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="ui-layer">
        <div class="panel">
            <h2>🕵️‍♂️ مستر جک (وایت‌چپل)</h2>
            <div id="conn-status">در حال اتصال...</div>
            <div id="my-id-box">کد شما: <span id="my-id">-</span></div>
            
            <hr>
            
            <input type="text" id="target-id" placeholder="کد حریف...">
            <button onclick="connectPeer()">اتصال به حریف</button>

            <hr>

            <div class="info-box">
                <div>دور: <b id="round-txt">1 / 8</b></div>
                <div>نوبت: <b id="turn-txt">کارآگاه</b></div>
            </div>

            <button id="witness-btn" class="btn-red" onclick="triggerWitness()">📣 فاز شاهد (پایان دور)</button>
        </div>
    </div>

    <!-- کانتینر اصلی موتور Phaser -->
    <div id="game-container"></div>

    <script src="game.js"></script>
</body>
</html>
